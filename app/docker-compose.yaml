services:
  api:
    build:
      context: .
    image: ${APP_IMAGE:-simpleapp-test:local}
    ports:
      - "${APP_PORT:-8008}:8008"
    environment:
      ELASTIC_APM_ENABLED: ${ELASTIC_APM_ENABLED:-false}
      ELASTIC_APM_SERVER_URL: ${ELASTIC_APM_SERVER_URL:-}
      ELASTIC_APM_SECRET_TOKEN: ${ELASTIC_APM_SECRET_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - simpletest-network

networks:
  simpletest-network:
    driver: bridge
