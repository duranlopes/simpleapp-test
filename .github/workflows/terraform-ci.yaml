name: Terraform CI

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yaml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  format-validate:
    name: Format and validate AWS root
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

  floci:
    name: Apply and destroy EKS against Floci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/floci
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:4566
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: Start Floci
        working-directory: terraform
        run: docker compose -f docker-compose.floci.yml up -d --wait

      - name: Wait for Floci
        working-directory: terraform
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4566/_floci/health > /tmp/floci-health.json; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/floci-health.json 2>/dev/null || true
          exit 1

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -refresh=false -lock=false -var-file=../floci.tfvars.example

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false -lock=false -var-file=../floci.tfvars.example

      - name: Verify active resources
        run: |
          test "$(terraform output -raw cluster_status)" = "ACTIVE"
          test "$(terraform output -raw node_group_status)" = "ACTIVE"

      - name: Terraform destroy
        if: always()
        run: terraform destroy -auto-approve -input=false -lock=false -var-file=../floci.tfvars.example

      - name: Stop Floci
        if: always()
        working-directory: terraform
        run: docker compose -f docker-compose.floci.yml down -v
