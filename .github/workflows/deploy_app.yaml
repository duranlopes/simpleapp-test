name: Deploy application

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region
        required: true
        default: us-east-1
      cluster_name:
        description: EKS cluster name
        required: true
        default: simpleapp

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  HELM_RELEASE: simpleapp
  HELM_NAMESPACE: prova

jobs:
  build:
    name: Build and publish application image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint kubernetes/helm/simpleapp

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image reference
        id: image
        run: echo "image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to EKS with Helm
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Configure kubeconfig
        run: aws eks update-kubeconfig --region "${{ inputs.aws_region }}" --name "${{ inputs.cluster_name }}"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure GHCR pull secret
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          test -n "$GHCR_READ_TOKEN" || { echo "GHCR_READ_TOKEN is required" >&2; exit 1; }
          kubectl create namespace "$HELM_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull \
            --namespace "$HELM_NAMESPACE" \
            --docker-server ghcr.io \
            --docker-username "${{ github.actor }}" \
            --docker-password "$GHCR_READ_TOKEN" \
            --docker-email "${{ github.actor }}@users.noreply.github.com" \
            --dry-run=client --output yaml | kubectl apply -f -

      - name: Validate rendered chart against the cluster API
        env:
          IMAGE_REPOSITORY: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm template "$HELM_RELEASE" kubernetes/helm/simpleapp \
            --namespace "$HELM_NAMESPACE" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set-string image.tag="$IMAGE_TAG" \
            --set image.pullSecrets[0].name=ghcr-pull \
            | kubectl apply --dry-run=server --filename -

      - name: Deploy Helm release
        env:
          IMAGE_REPOSITORY: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install "$HELM_RELEASE" kubernetes/helm/simpleapp \
            --namespace "$HELM_NAMESPACE" \
            --create-namespace \
            --atomic \
            --wait \
            --timeout 5m \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set-string image.tag="$IMAGE_TAG" \
            --set image.pullSecrets[0].name=ghcr-pull
